<!doctype html>
<html lang="pt-PT">
<head>
<script>
(function () {
  try {
    var pal = localStorage.getItem('pw_paleta') || 'A';
    var modoPref = localStorage.getItem('pw_modo') || 'automatico';
    var modo = modoPref === 'automatico'
      ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'escuro')
      : modoPref;
    document.documentElement.setAttribute('data-paleta', pal);
    document.documentElement.setAttribute('data-modo', modo);
  } catch (e) {
    document.documentElement.setAttribute('data-paleta', 'A');
    document.documentElement.setAttribute('data-modo', 'escuro');
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Penny Wise">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Penny Wise: Importar Excel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .correcao { display:flex; gap:12px; padding:11px 0; align-items:flex-start }
  .correcao__check { flex:none; margin-top:2px; color: var(--dot) }
  .correcao__texto { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0 }
  .correcao__titulo { font-size:14px; font-weight:500; line-height:1.3 }
  .correcao__sub { font-size:12px; color: var(--muted2) }
  .correcao--opcional { flex-wrap:wrap }
  .correcao__opcoes {
    display:flex; gap:2px; padding:2px; border-radius:999px; background:rgba(0,0,0,0.08); flex:none; margin-top:2px;
  }
  .correcao__opcoes button {
    border:0; background:none; font-family:inherit; font-size:12px; font-weight:500; padding:5px 10px; border-radius:999px;
    cursor:pointer; color:var(--muted2);
  }
  .correcao__opcoes button.is-active { background:var(--text); color:var(--bg) }
</style>
</head>
<body>
<div class="app">
  <div class="app__blobs">
    <span class="blob" style="top:-230px; right:-210px; width:440px; height:440px; background:var(--glow1); opacity:.8"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grao-im"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grao-im)"></rect></svg>

  <div class="app__content app__content--cta">
    <p class="display"><span class="muted">Importar o</span><br>teu Excel</p>

    <input type="file" id="campo-ficheiro" accept=".xlsx" hidden>
    <button type="button" id="botao-escolher-ficheiro" class="glass glass--pill" style="height:64px; display:flex; align-items:center; gap:12px; padding:0 18px 0 10px; width:100%; cursor:pointer; font-family:inherit; text-align:left">
      <span style="width:44px; height:44px; border-radius:22px; background:var(--btn); display:flex; align-items:center; justify-content:center; flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M9 13l2 2 4-4"/></svg>
      </span>
      <span style="flex:1; display:flex; flex-direction:column; gap:2px">
        <span style="font-size:15px; font-weight:500" id="nome-ficheiro">Escolher ficheiro .xlsx</span>
        <span class="muted2" style="font-size:12px" id="resumo-ficheiro">Ex.: Financas_2026.xlsx</span>
      </span>
    </button>

    <div id="bloco-resultado" hidden>
      <span class="eyebrow">Correções automáticas</span>
      <div class="glass glass-rows" id="lista-correcoes"></div>

      <div id="bloco-revisao" hidden>
        <span class="eyebrow">Por rever (sem valor, vão para Avisos)</span>
        <div class="glass glass-rows" id="lista-revisao"></div>
      </div>

      <span class="eyebrow">Total que sobrou no ano</span>
      <div class="grid-2">
        <div class="stat-pill">
          <span class="stat-pill__label">No Excel</span>
          <span class="stat-pill__value" id="total-excel"></span>
        </div>
        <div class="stat-pill">
          <span class="stat-pill__label">Na Penny Wise</span>
          <span class="stat-pill__value warn-text" id="total-pw"></span>
        </div>
      </div>
      <span style="font-size:12px; line-height:1.4; color:var(--muted); padding:0 4px">
        A diferença vem das correções acima.
      </span>
    </div>

    <span id="erro-importacao" class="warn-text" style="font-size:13px; text-align:center" hidden></span>

    <button type="button" id="botao-comecar-do-zero" style="border:0; background:none; font-family:inherit; font-size:13px; color:var(--muted); text-decoration:underline; padding:4px; margin:0 auto; cursor:pointer">
      Não tenho ficheiro — começar do zero
    </button>
  </div>

  <button type="button" id="botao-importar" class="btn-solid" style="position:fixed; left:20px; right:20px; bottom:50px; max-width:440px; margin:0 auto; z-index:3" disabled>Escolhe um ficheiro primeiro</button>

  <div id="sheet-duplicados" class="sheet-fundo" hidden>
    <div class="sheet-corpo">
      <div class="sheet-cabecalho">
        <span class="sheet-titulo">Possíveis duplicados</span>
        <button type="button" class="sheet-fechar" id="btn-x-duplicados" aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-corpo-conteudo">
        <span style="font-size:13px; color:var(--sheet-muted)">Estes movimentos já existem na app, com a mesma data, descrição e valor. Escolhe o que fazer com cada um.</span>
        <div style="display:flex; gap:8px">
          <button type="button" id="btn-aceitar-todos-duplicados" class="sheet-botao sheet-botao--limpar" style="flex:1">Aceitar todas</button>
          <button type="button" id="btn-descartar-todos-duplicados" class="sheet-botao sheet-botao--limpar" style="flex:1">Descartar todas</button>
        </div>
        <div id="lista-duplicados" style="display:flex; flex-direction:column; gap:10px"></div>
      </div>
      <div class="sheet-rodape">
        <button type="button" id="btn-confirmar-duplicados" class="sheet-botao sheet-botao--guardar" style="width:100%">Continuar importação</button>
      </div>
    </div>
  </div>
</div>
<script src="js/paleta.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/supabase.js" defer></script>
<script src="js/db.js" defer></script>
<script src="js/sync.js" defer></script>
<script src="js/calculos.js" defer></script>
<script src="js/avisos.js" defer></script>
<script src="js/recorrentes.js" defer></script>
<script src="js/alerta.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/moeda.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="js/importar-excel.js" defer></script>
<script src="js/ecras/importar.js" defer></script>
</body>
</html>
