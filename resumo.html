<!doctype html>
<html lang="pt-PT">
<head>
<script>
(function () {
  try {
    var pal = localStorage.getItem('pw_paleta') || 'A';
    var modoPref = localStorage.getItem('pw_modo') || 'automatico';
    var modo = modoPref === 'automatico'
      ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'escuro')
      : modoPref;
    document.documentElement.setAttribute('data-paleta', pal);
    document.documentElement.setAttribute('data-modo', modo);
  } catch (e) {
    document.documentElement.setAttribute('data-paleta', 'A');
    document.documentElement.setAttribute('data-modo', 'escuro');
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Penny Wise">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Penny Wise: Resumo de outubro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="app">
  <div class="app__blobs">
    <span class="blob" style="top:-200px; left:-180px; width:440px; height:400px; background:var(--glow3); opacity:.7"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grao-re2"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grao-re2)"></rect></svg>

  <div class="app__content pw-carregar">
    <div class="topbar"><div id="app-back"></div></div>
    <p class="display" style="margin-bottom:0">Resumos mensais</p>

    <div class="seletor-mes">
      <button type="button" id="mes-anterior" aria-label="Mês anterior">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div style="display:flex; flex-direction:column; align-items:center; gap:2px">
        <span style="font-size:20px; font-weight:500; letter-spacing:-0.6px" id="mes-titulo">Outubro 2026</span>
      </div>
      <button type="button" id="mes-seguinte" aria-label="Mês seguinte">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <p class="display" id="frase-resumo"></p>

    <div class="grid-2" id="grelha-resumo"></div>

    <span class="eyebrow" id="rotulo-proximo-mes">Para novembro</span>
    <div id="dicas-resumo"></div>

    <span class="muted" style="font-size:12px; padding:0 4px">Escrito a partir da biblioteca de dicas. A IA do Claude está desligada.</span>
  </div>
</div>
