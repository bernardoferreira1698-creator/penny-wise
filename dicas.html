<!doctype html>
<html lang="pt-PT">
<head>
<script>
(function () {
  try {
    var pal = localStorage.getItem('pw_paleta') || 'A';
    var modoPref = localStorage.getItem('pw_modo') || 'automatico';
    var modo = modoPref === 'automatico'
      ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'escuro')
      : modoPref;
    document.documentElement.setAttribute('data-paleta', pal);
    document.documentElement.setAttribute('data-modo', modo);
  } catch (e) {
    document.documentElement.setAttribute('data-paleta', 'A');
    document.documentElement.setAttribute('data-modo', 'escuro');
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  .dica-card { display:flex; flex-direction:column; gap:10px; padding:16px 18px }
  .dica-card__topo { display:flex; justify-content:space-between; align-items:center; gap:10px }
  .dica-card__texto { font-size:18px; line-height:1.22; font-weight:500; letter-spacing:-0.3px }
  .guardar-btn {
    width:36px; height:36px; border:0; border-radius:18px; background:rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  html[data-modo="claro"] .guardar-btn { background: rgba(0,0,0,0.05) }
  .tema-cabecalho { font-size:15px; font-weight:600; padding:8px 4px 0 }
  [hidden] { display:none !important; }
</style>

<body>
<div class="app">
  <div class="app__blobs">
    <span class="blob" style="top:-230px; right:-210px; width:440px; height:440px; background:var(--glow1); opacity:.8"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grao-di"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grao-di)"></rect></svg>

  <div class="app__content">
    <div class="topbar"><div id="app-back"></div></div>
    <p class="display"><span class="muted">Dicas para</span><br>gastar melhor.</p>

    <div class="tabs" id="tabs-dicas">
      <button type="button" class="tabs__item is-active" data-aba="para-ti">Para ti</button>
      <button type="button" class="tabs__item" data-aba="guardadas">Guardadas</button>
      <button type="button" class="tabs__item" data-aba="todas">Todas</button>
    </div>

    <div id="lista-dicas" class="stack stack--lg"></div>
    <p id="mensagem-vazia" class="muted" style="text-align:center; padding:24px 0" hidden>Ainda não guardaste nenhuma dica.</p>
    <p id="mensagem-carregando" class="muted" style="text-align:center; padding:24px 0">A carregar dicas…</p>
  </div>
</div>
