<!doctype html>
<html lang="pt-PT">
<head>
<script>
(function () {
  try {
    var pal = localStorage.getItem('pw_paleta') || 'A';
    var modoPref = localStorage.getItem('pw_modo') || 'automatico';
    var modo = modoPref === 'automatico'
      ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'escuro')
      : modoPref;
    document.documentElement.setAttribute('data-paleta', pal);
    document.documentElement.setAttribute('data-modo', modo);
  } catch (e) {
    document.documentElement.setAttribute('data-paleta', 'A');
    document.documentElement.setAttribute('data-modo', 'escuro');
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Penny Wise">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Penny Wise: Categorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .cat-linha {
    display:flex; justify-content:space-between; align-items:center; height:42px; border-bottom:1px solid var(--linha);
    width:100%; background:none; border-left:0; border-right:0; border-top:0; font-family:inherit; cursor:pointer; color:inherit; text-align:left;
  }
  .glass-rows > .cat-linha:last-child { border-bottom:0 }
  .cat-linha__periodicidade { display:flex; align-items:center; gap:8px }
  .sheet-campo-texto {
    height:54px; border-radius:999px; background:rgba(0,0,0,0.05); display:flex; align-items:center; padding:0 20px;
  }
  .sheet-campo-texto input { flex:1; border:0; background:transparent; font-family:inherit; font-size:16px; font-weight:500; color:var(--sheet-ink); outline:none }
  .subcat-chip {
    display:inline-flex; align-items:center; gap:6px; padding:6px 8px 6px 14px; border-radius:999px;
    background:rgba(0,0,0,0.05); font-size:13px; font-weight:500; color:var(--sheet-ink);
  }
  .subcat-chip button { width:20px; height:20px; border-radius:10px; border:0; background:rgba(0,0,0,0.08); color:var(--sheet-ink); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; line-height:1 }
  [hidden] { display:none !important }
</style>
</head>
<body>
<div class="app">
  <div class="app__blobs">
    <span class="blob" style="top:-230px; right:-210px; width:440px; height:440px; background:var(--glow1); opacity:.8"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grao-ca"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grao-ca)"></rect></svg>

  <div class="app__content app__content--cta">
    <div class="topbar"><a href="definicoes.html" class="pill-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Definições</a></div>
    <p class="display"><span class="muted">As tuas</span><br>categorias</p>

    <div class="tabs" id="tabs-categorias">
      <button type="button" class="tabs__item is-active" data-aba="despesas">Despesas</button>
      <button type="button" class="tabs__item" data-aba="rendimentos">Rendimentos</button>
    </div>

    <div class="glass glass-rows" id="lista-despesas"></div>
    <div class="glass glass-rows" id="lista-rendimentos" hidden></div>
  </div>

  <a href="#" id="btn-nova-categoria" class="btn-solid" style="position:fixed; left:20px; right:20px; bottom:50px; max-width:440px; margin:0 auto; z-index:3">Nova categoria</a>

  <div id="sheet-editar-categoria" class="sheet-fundo" hidden>
    <div class="sheet-corpo">
      <div class="sheet-cabecalho">
        <span class="sheet-titulo">Editar categoria</span>
        <button type="button" class="sheet-fechar" id="btn-x-categoria" aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-corpo-conteudo">
        <div class="sheet-campo-texto"><input id="nome-categoria" type="text" placeholder="Nome da categoria"></div>
        <span style="font-size:13px; font-weight:500; color:var(--sheet-muted)">Periodicidade por defeito</span>
        <div class="seg" id="seg-periodicidade-categoria" style="background:rgba(0,0,0,0.05)">
          <button type="button" class="seg__item" data-valor="Fixa">Fixa</button>
          <button type="button" class="seg__item" data-valor="Variável">Variável</button>
        </div>
        <span style="font-size:13px; font-weight:500; color:var(--sheet-muted)">Subcategorias</span>
        <div id="lista-subcategorias" style="display:flex; flex-wrap:wrap; gap:8px"></div>
        <div class="sheet-campo-texto">
          <input id="nova-subcategoria" type="text" placeholder="Adicionar subcategoria">
          <button type="button" id="btn-add-subcategoria" style="border:0; background:var(--prim-solid); color:#fff; width:32px; height:32px; border-radius:16px; font-size:18px; cursor:pointer; flex:none">+</button>
        </div>
      </div>
      <div class="sheet-rodape">
        <button type="button" class="sheet-botao sheet-botao--limpar" id="btn-fechar-categoria">Fechar</button>
        <button type="button" class="sheet-botao sheet-botao--guardar" id="btn-guardar-categoria">Guardar</button>
      </div>
    </div>
  </div>
</div>
<script src="js/paleta.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/supabase.js" defer></script>
<script src="js/db.js" defer></script>
<script src="js/sync.js" defer></script>
<script src="js/calculos.js" defer></script>
<script src="js/avisos.js" defer></script>
<script src="js/recorrentes.js" defer></script>
<script src="js/alerta.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/dados-mock.js" defer></script>
<script src="js/ecras/categorias.js" defer></script>
</body>
</html>
