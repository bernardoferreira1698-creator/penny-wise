<!doctype html>
<html lang="pt-PT">
<head>
<script>
(function () {
  try {
    var pal = localStorage.getItem('pw_paleta') || 'A';
    var modoPref = localStorage.getItem('pw_modo') || 'automatico';
    var modo = modoPref === 'automatico'
      ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'claro' : 'escuro')
      : modoPref;
    document.documentElement.setAttribute('data-paleta', pal);
    document.documentElement.setAttribute('data-modo', modo);
  } catch (e) {
    document.documentElement.setAttribute('data-paleta', 'A');
    document.documentElement.setAttribute('data-modo', 'escuro');
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6A1F">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Penny Wise: Contas da casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .grafico-casa { display:flex; gap:6px }
  .grafico-casa__col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px }
  .grafico-casa__cima { height:90px; width:100%; display:flex; align-items:flex-end; justify-content:center }
  .grafico-casa__barra { width:100%; max-width:18px; border-radius:8px 8px 3px 3px; background:var(--bar-v); border:0; padding:0; cursor:pointer; font-family:inherit }
  .grafico-casa__bolha {
    position:absolute; transform:translate(-50%, -100%); margin-top:-6px;
    background:var(--sheet-bg); color:var(--sheet-ink); font-size:12px; font-weight:600;
    padding:5px 10px; border-radius:999px; white-space:nowrap; pointer-events:none; z-index:2;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>
<div class="app">
  <div class="app__blobs">
    <span class="blob" style="top:-200px; right:-200px; width:420px; height:400px; background:var(--glow1); opacity:.7"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grao-cs"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grao-cs)"></rect></svg>

  <div class="app__content">
    <div class="topbar"><div id="app-back"></div></div>
    <p class="display" id="frase-casa"></p>

    <div class="glass glass-rows" id="lista-habitacao"></div>
    <span class="muted" style="font-size:12px; padding:0 4px" id="nota-sem-registos"></span>

    <div class="glass" style="padding:16px 18px; display:flex; flex-direction:column; gap:12px; position:relative">
      <div style="display:flex; justify-content:space-between; font-size:13px"><span class="muted2">Habitação, mês a mês (toca numa barra)</span><span class="muted2" id="media-habitacao"></span></div>
      <div class="grafico-casa" id="grafico-casa"></div>
      <span class="muted" style="font-size:12px" id="nota-escala"></span>
    </div>
  </div>
</div>
